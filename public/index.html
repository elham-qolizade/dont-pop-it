<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don't Pop It</title>
<meta name="description" content="One balloon, pumped by everyone online. Nobody knows when it pops. Don't be the one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Vazirmatn:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one object in an empty room. The balloon grows upward from a fixed point, one number under it, everything else whispered at the edges. */
:root {
  --bg: #f3f2ee;
  --fg: #171615;
  --muted: #8b8882;
  --faint: rgba(23,22,21,.08);
  --danger: #e2552b;
  --sheet: #ffffff;
  --balloon: #e2552b;
  --f-sans: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --f-serif: "EB Garamond", "Iowan Old Style", Georgia, serif;
  --stamp: #c8331d;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #131312; --fg: #ecebe7; --muted: #8d8a84; --faint: rgba(236,235,231,.09); --danger: #ff6a3d; --sheet: #1c1c1a; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body {
  font-family: var(--f-sans); font-size: 15px; line-height: 1.45;
  display: grid; grid-template-rows: auto 1fr auto; min-height: 100%;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  overflow: hidden;
  transition: background-color .5s ease;
}
body.flash { background: var(--danger); transition: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; border-radius: 4px; }

.top, .bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.word { color: var(--fg); font-weight: 600; letter-spacing: -.01em; }
.top-right { display: flex; gap: 18px; align-items: center; }
.live { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: #3aa35b; }
.live.off i { background: var(--danger); }
.link:hover { color: var(--fg); }

.stage { display: grid; place-items: center; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.center { display: grid; justify-items: center; gap: 14px; text-align: center; width: 100%; }
.status { font-size: 14px; color: var(--muted); min-height: 1.4em; }
.status b { color: var(--fg); font-weight: 500; }
.box { position: relative; width: 100%; display: flex; justify-content: center; align-items: flex-end; }
.balloon { position: relative; transition: width .22s cubic-bezier(.2,1.4,.4,1); transform-origin: 50% 80%; --stretch: 0; }
.balloon svg { display: block; width: 100%; height: auto; overflow: visible; }
.balloon .skin { fill: var(--balloon); }
.balloon .shine { fill: #fff; opacity: calc(.18 + var(--stretch) * .5); }
.balloon .string { fill: none; stroke: var(--muted); stroke-width: 1; }
.balloon .wobble { transform-origin: 50px 118px; animation: sway 4s ease-in-out infinite; }
@keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
.balloon.tense .wobble { animation: shiver .12s linear infinite; }
@keyframes shiver { 0%,100% { transform: translateX(-.6px); } 50% { transform: translateX(.6px); } }
.pulse { animation: pulse .16s ease-out; }
@keyframes pulse { 40% { transform: scale(1.05); } }
.breath { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-family: var(--f-mono); font-size: 22px; color: var(--fg); pointer-events: none; font-variant-numeric: tabular-nums; }
.plus {
  position: absolute; bottom: 55%; font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap;
  pointer-events: none; animation: plus 1.1s ease-out forwards;
}
.plus.me { color: var(--fg); }
@keyframes plus { from { opacity: 0; transform: translateY(8px); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(-46px); } }
.shard { position: fixed; z-index: 5; width: 12px; height: 16px; border-radius: 40% 60% 50% 50%; background: var(--balloon); pointer-events: none; animation: shard .8s cubic-bezier(.2,.7,.4,1) forwards; }
@keyframes shard { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.5); opacity: 0; } }

.count { font-family: var(--f-mono); font-size: clamp(44px, 9vw, 72px); letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; transition: color .3s; }
.count.popped { color: var(--danger); }
.hint { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.bank {
  font-family: var(--f-mono); font-size: 13px; border: 1px solid var(--muted); border-radius: 999px; padding: 7px 16px;
  color: var(--fg); transition: background-color .15s, color .15s;
}
.bank:hover { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.bank-row { min-height: 34px; display: grid; place-items: center; }
body.tremble .center { animation: quake .1s linear infinite; }
@keyframes quake { 0%,100% { transform: translate(.7px, 0); } 50% { transform: translate(-.7px, .5px); } }
.report {
  position: absolute; inset: 0; margin: auto; width: min(440px, 100%); height: fit-content;
  display: grid; gap: 14px; text-align: start; cursor: default; animation: up .3s ease both;
}
.report .r-title { font-size: clamp(30px, 6vw, 44px); font-weight: 600; letter-spacing: -.03em; line-height: 1; margin: 0; }
.report .r-title.me { color: var(--danger); }
.report .r-sub { margin: 0; color: var(--muted); font-size: 15px; }
.report .r-sub b { color: var(--fg); font-weight: 500; }
.r-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; border-block: 1px solid var(--faint); padding-block: 12px; }
.r-grid div { display: grid; gap: 2px; min-width: 0; }
.r-grid b { font-family: var(--f-mono); font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums; }
.r-grid span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.r-you { display: grid; gap: 4px; font-size: 14px; }
.r-you .verdict { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.r-you .line { color: var(--muted); }
.r-you .line b { color: var(--fg); font-weight: 500; font-family: var(--f-mono); }
.r-extra { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.r-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.r-actions button { border: 1px solid var(--faint); border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight: 500; }
.r-actions .primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.r-next { margin-inline-start: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
@media (max-width: 460px) { .r-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.obit {
  position: relative; background: var(--sheet); color: var(--fg); text-align: center;
  border: 1px solid var(--fg); outline: 1px solid var(--fg); outline-offset: -6px;
  padding: 26px 24px 22px; font-family: var(--f-serif); display: grid; gap: 8px; overflow: hidden;
}
.o-kicker { font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
.o-name { margin: 0; font-size: clamp(34px, 7vw, 46px); font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.o-dates { font-style: italic; color: var(--muted); font-size: 16px; }
.o-cross { width: 40px; height: 1px; background: var(--fg); margin: 6px auto; }
.o-body { margin: 0; font-size: 17px; line-height: 1.4; text-wrap: balance; }
.o-body b { font-weight: 600; }
.o-last { margin: 4px 0 0; font-style: italic; font-size: 17px; }
.o-you { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--faint); display: grid; gap: 3px; font-size: 15px; }
.o-you b { font-weight: 600; }
.o-verdict { font-style: italic; color: var(--muted); }
.stamp {
  position: absolute; top: 22px; right: 10px; transform: rotate(-14deg);
  font-family: var(--f-mono); font-weight: 500; font-size: 15px; letter-spacing: .14em; color: var(--stamp);
  border: 3px solid var(--stamp); border-radius: 6px; padding: 5px 10px; opacity: 0;
  mix-blend-mode: multiply; animation: stamp .28s cubic-bezier(.3,1.6,.5,1) .55s forwards;
}
@media (prefers-color-scheme: dark) { .stamp { mix-blend-mode: normal; } }
.stamp::after { content: ""; position: absolute; inset: 2px; border: 1px solid var(--stamp); border-radius: 3px; opacity: .6; }
@keyframes stamp { from { opacity: 0; transform: rotate(-14deg) scale(2.6); } to { opacity: .88; transform: rotate(-14deg) scale(1); } }
.record { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-height: 1.4em; }

.news { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity .4s; }
.news.fade { opacity: 0; }

.overlay {
  position: fixed; inset: 0; z-index: 20; background: rgba(10,10,9,.35); display: grid; place-items: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet { width: min(420px, 100%); background: var(--sheet); border-radius: 14px; padding: 22px; display: grid; gap: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.18); animation: up .25s ease both; }
@keyframes up { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.sheet h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--faint); font-size: 14px; }
.rows li:last-child { border-bottom: 0; }
.rows .k { min-width: 0; overflow-wrap: anywhere; }
.rows .k small { display: block; color: var(--muted); font-size: 12px; }
.rows .v { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sheet img { width: 100%; border-radius: 8px; display: block; border: 1px solid var(--faint); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions a, .actions button { flex: 1 1 auto; text-align: center; text-decoration: none; border-radius: 8px; padding: 11px 12px; font-size: 14px; font-weight: 500; border: 1px solid var(--faint); color: var(--fg); }
.actions .primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.close-x { justify-self: end; color: var(--muted); font-size: 13px; }

/* Persian: right-to-left, Persian type, no mono digits (mono faces have no Persian numerals) */
html[lang="fa"] { --f-sans: "Vazirmatn", Tahoma, sans-serif; --f-mono: "Vazirmatn", Tahoma, sans-serif; --f-serif: "Noto Naskh Arabic", "Vazirmatn", serif; }
html[lang="fa"] .o-kicker { letter-spacing: 0; font-size: 15px; }
html[lang="fa"] .o-name { font-size: clamp(30px, 6vw, 40px); line-height: 1.3; }
html[lang="fa"] .o-body, html[lang="fa"] .o-last { line-height: 1.8; font-size: 16px; }
html[lang="fa"] .stamp { right: auto; left: 10px; transform: rotate(12deg); letter-spacing: 0; font-size: 17px; animation-name: stamp-fa; }
@keyframes stamp-fa { from { opacity: 0; transform: rotate(12deg) scale(2.6); } to { opacity: .88; transform: rotate(12deg) scale(1); } }
.lang { font-family: var(--f-sans); }
@media (prefers-reduced-motion: reduce) { .balloon .wobble, body.tremble .center { animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <span class="word" data-t="name">don't pop it</span>
  <div class="top-right">
    <span class="live" id="live"><i></i><span id="online">connecting</span></span>
    <button class="link lang" id="langBtn" type="button">فارسی</button>
    <button class="link" id="soundBtn" type="button" aria-pressed="true">sound on</button>
  </div>
</header>

<main class="stage" id="stage" aria-live="polite">
  <div class="center">
    <div class="status" id="status">&nbsp;</div>
    <div class="box" id="box">
      <span class="breath" id="breath" aria-live="off"></span>
      <div class="report" id="report" hidden></div>
      <div class="balloon" id="balloon">
        <svg viewBox="0 0 100 150" role="img" aria-label="Balloon">
          <g class="wobble">
            <ellipse class="skin" cx="50" cy="58" rx="46" ry="56"/>
            <ellipse class="shine" cx="33" cy="34" rx="9" ry="15" transform="rotate(-24 33 34)"/>
            <path class="skin" d="M45 112 L55 112 L52 120 L48 120 Z"/>
            <path class="string" d="M50 120 C46 130 54 138 50 150"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="count" id="count">0</div>
    <div class="bank-row"><button class="bank" id="bankBtn" type="button" hidden></button></div>
    <div class="hint" id="hint">&nbsp;</div>
    <div class="record" id="record">&nbsp;</div>
  </div>
</main>

<footer class="bottom">
  <span class="news" id="news">&nbsp;</span>
  <button class="link" id="recordsBtn" type="button" data-t="records">records</button>
</footer>

<div class="overlay" id="recordsOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="recTitle">
    <h2 id="recTitle" data-t="recTitle">Useless records</h2>
    <div><h3 data-t="recordsH">Records</h3><ul class="rows" id="records"></ul></div>
    <div><h3 data-t="wallH">Wall of shame</h3><ul class="rows" id="wall"></ul></div>
    <button class="close-x" type="button" data-close data-t="close">close</button>
  </div>
</div>

<div class="overlay" id="popOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="popTitle">
    <h2 id="popTitle">Your certificate</h2>
    <img id="certImg" alt="Certificate for popping the world's balloon">
    <div class="actions">
      <a class="primary" id="downloadBtn" download="dont-pop-it.png" href="#" data-t="saveImg">Save image</a>
      <button type="button" id="copyBtn" data-t="copyText">Copy text</button>
      <button type="button" data-close data-t="keepPlaying">Keep playing</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const COLORS = ['#e2552b', '#2f6fde', '#e0a526', '#2e9d6a', '#c2439a', '#6a55d8'];
  const COOLDOWN = 330; // a little above the server's 300 ms so clicks never bounce
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';

  let me = null, snap = null, shownId = null, shownPumps = 0, lastPumpAt = 0, myPending = 0, lastPlusAt = 0;
  let poppedView = null, lastPopEvent = null, lastNews = '', myStreak = 0, myScore = 0, curDanger = 0;

  // ---------- language: English and Persian ----------
  let lang = 'fa'; // Persian by default; a visitor's own choice is remembered
  try { lang = localStorage.getItem('dpi.lang') || 'fa'; } catch (e) {}
  const N = (n) => Number(n).toLocaleString(lang === 'fa' ? 'fa-IR' : 'en-US');
  const B = (s) => `<bdi>${esc(s)}</bdi>`; // keeps Latin city names readable inside Persian sentences
  const L = {
    en: {
      name: "don't pop it", records: 'records', recTitle: 'Useless records', recordsH: 'Records', wallH: 'Wall of shame', close: 'close',
      saveImg: 'Save image', copyText: 'Copy text', keepPlaying: 'Keep playing', langBtn: 'فارسی',
      connecting: 'connecting', reconnecting: 'reconnecting', online: (n) => n <= 1 ? 'just you' : `${N(n)} online`,
      sound: (on) => on ? 'sound on' : 'sound off',
      hint: 'click for a puff. hold for a bigger breath. bank your streak before it pops.',
      danger: (pct) => `${N(pct)}% of balloons have popped by this size.`,
      lastPump: (c) => `last pump: someone in <b>${B(c)}</b>`, untouched: (id) => `balloon #${N(id)} · untouched`,
      you: 'you', recordLine: (s, pts, big) => `streak ${N(s)} · banked ${N(pts)} pts` + (big ? ` · biggest balloon ever: ${N(big)}` : ''),
      bankBtn: (s) => `bank streak of ${N(s)} → +${N(s * s)} pts`, banked: (p) => `banked +${N(p)}`,
      youPopped: '<b>you popped it.</b>', poppedBy: (c) => `popped by someone in <b>${B(c)}</b>`,
      next: (n) => n > 0 ? `next balloon in ${N(n)}s` : 'here it comes',
      shareBtn: 'Copy share text', certBtn: (you) => you ? 'Get death certificate' : 'Get funeral card', copied: 'Copied', copyBlocked: 'Copy blocked',
      secs: (ms) => ms < 60000 ? N(+(ms / 1000).toFixed(ms < 10000 ? 1 : 0)) + 's' : N(+(ms / 60000).toFixed(1)) + 'm',
      pumps: (n) => `${N(n)} ${n === 1 ? 'pump' : 'pumps'}`,
      verdicts: {
        you: ['You did this.', 'Murderer.', 'The internet will remember.', 'Well. That happened.'],
        none: ["You didn't touch it. Coward or genius?", 'You just watched. Wise.', 'Not your fault. This time.'],
        close: ['That was terrifyingly close.', 'You almost did it.', 'Your heart should be racing.'],
        mid: ['Close enough to feel it.', 'You were right there.', 'You felt that one.'],
        far: ['Safe distance. Boring, but alive.', 'You played it safe.', 'Nowhere near it. Respect.'],
      },
      lastWords: ['I just wanted to float.', 'Tell my string I loved it.', 'One more is fine, they said.', 'Is it getting tight in here?',
        'I regret nothing. Except that last pump.', 'Avenge me.', 'I can see my house from here.', 'Was it something I inhaled?',
        'Who keeps blowing?', 'Please. I have a family of party decorations.'],
      roles: { GUILTY: 'GUILTY', ACCOMPLICE: 'ACCOMPLICE', DECEASED: 'DECEASED' },
      kicker: 'In loving memory', oName: (id) => `Balloon #${N(id)}`, dates: (b, d) => `Born ${b} · Died ${d}`,
      lived: (t, n) => `It lived <b>${t}</b> and grew to <b>${n}</b>.`,
      survived: (p, c) => `Survived by ${N(p)} grieving ${p === 1 ? 'pumper' : 'pumpers'} from ${N(c)} ${c === 1 ? 'city' : 'cities'}.`,
      bigBreath: (c, a) => ` Its biggest breath came from ${B(c)} (+${N(a)}).`,
      killerYou: 'It was popped by <b>you</b>. The family has questions.',
      killer: (c) => `It was popped by someone in <b>${B(c)}</b>, who has not yet apologized.`,
      lastWordsLine: (w) => `Last words: “${w}”`,
      cause: (n) => `<b>Cause of death:</b> your pump, #${N(n)}.`, buried: (s) => `Your streak of ${N(s)} was buried with it.`,
      yourPart: (n, r, p) => `<b>Your part:</b> ${n} · rank #${N(r)} of ${N(p)}`,
      yourLast: (n, t) => `<b>Your last pump:</b> ${n} before its death, ${t} earlier.`,
      noPart: 'You did not take part. Flowers were not sent.',
      certTitle: (you) => you ? 'Certificate of Death' : 'Funeral Attendance Card',
      certNo: (id) => `NO. ${String(id).padStart(6, '0')}  ·  DON'T POP IT REGISTRY`,
      certRowsYou: (p) => [['DECEASED', `Balloon #${p.id}`], ['BORN · DIED', `${p.bornS} · ${p.diedS}`],
        ['AGE AT DEATH', `${L.en.secs(p.ageMs)}, ${L.en.pumps(p.pumps)}`], ['CAUSE OF DEATH', `Pump #${p.pumps}, administered by someone in ${p.city}`],
        ['MOURNERS', `${p.people} people from ${p.cities} ${p.cities === 1 ? 'city' : 'cities'}`], ['LAST WORDS', `“${p.lw}”`]],
      certRows: (p) => [['IN MEMORY OF', `Balloon #${p.id}`], ['LIVED', `${L.en.secs(p.ageMs)}, ${L.en.pumps(p.pumps)}`],
        ['POPPED BY', `someone in ${p.city}`], ['MY PART', p.yourPumps ? `${L.en.pumps(p.yourPumps)} · last one ${p.yourLastBefore} before its death` : 'I only watched'],
        ['MOURNERS', `${p.people} people from ${p.cities} ${p.cities === 1 ? 'city' : 'cities'}`], ['LAST WORDS', `“${p.lw}”`]],
      share: {
        you: (p, u) => [
          `Balloon #${p.id} has died. It was me. Pump ${p.pumps}. ${p.people} people from ${p.cities} ${p.cities === 1 ? 'city' : 'cities'} are in mourning. ${u}`,
          `Officially stamped GUILTY for popping the internet's balloon at pump ${p.pumps}. Its last words: "${p.lw}" ${u}`,
          `${p.people} strangers spent ${L.en.secs(p.ageMs)} raising a balloon together. I killed it. The family has questions. ${u}`],
        accomplice: (p, u) => `I made the last safe pump before Balloon #${p.id} died. Stamped ACCOMPLICE. Someone in ${p.city} finished it. ${u}`,
        pumped: (p, u) => `RIP Balloon #${p.id} (${L.en.secs(p.ageMs)}, ${p.pumps} pumps). My last pump was ${p.yourLastBefore} before it died. Popped by someone in ${p.city}. ${u}`,
        watched: (p, u) => `Attended the funeral of Balloon #${p.id}. ${p.people} people were blowing it up. Someone in ${p.city} popped it. Last words: "${p.lw}" ${u}`,
      },
      news: {
        ready: (n) => `Balloon #${N(n.id)} is ready. It looks harmless.`,
        milestone: (n) => `Balloon #${N(n.id)} has passed ${N(n.n)} pumps. Nobody is stopping.`,
        breath: (n) => `Someone in ${n.city} just blew ${N(n.amount)} pumps into balloon #${N(n.id)} in one breath.`,

        accomplice: (p, u) => `آخرین پمپ امن قبل از مرگ بادکنک #${p.id} مال من بود. مهر «همدست» خوردم. یه نفر از ${p.city} کارشو تموم کرد. ${u}`,

        popped: (n) => `فوری: بادکنک #${N(n.id)} در پمپ ${N(n.pumps)} ترکید. کار یه نفر از ${n.city} بود.`,
        bank: (n) => `یه نفر از ${n.city} با زنجیره‌ی ${N(n.streak)} پمپی کنار کشید. زرنگ.`,

      rec: {
        biggest: 'بزرگ‌ترین بادکنک', smallest: 'کوتاه‌عمرترین بادکنک', streak: 'طولانی‌ترین زنجیره‌ی امن', bank: 'بزرگ‌ترین برداشت',
        pumpsToday: 'پمپ‌های امروز', popsToday: 'بادکنک‌های ترکیده‌ی امروز', poppedBy: (c) => `ترکانده‌شده توسط یه نفر از ${B(c)}`,
        someone: (c) => `یه نفر از ${B(c)}`, bankSub: (s, c) => `زنجیره‌ی ${N(s)}، یه نفر از ${B(c)}`, pts: (n) => `+${N(n)} امتیاز`,

  const T = () => L[lang];

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    document.title = lang === 'fa' ? 'نترکونش' : "Don't Pop It";
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T()[el.dataset.t]; });
    $('langBtn').textContent = T().langBtn;
    $('soundBtn').textContent = T().sound(audio.on);
    if (snap) { lastNews = ''; applyState(snap); }
    if (poppedView && !$('report').hidden) showReport(poppedView, true);
    if (!snap) $('online').textContent = T().connecting;
  }
  $('langBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    lang = lang === 'fa' ? 'en' : 'fa';
    try { localStorage.setItem('dpi.lang', lang); } catch (err) {}
    applyLang();
  });


  // ---------- live connection ----------
  const es = new EventSource('/events?tz=' + encodeURIComponent(tz));
  es.addEventListener('hello', (e) => { me = JSON.parse(e.data); });
  es.addEventListener('state', (e) => applyState(JSON.parse(e.data)));
  es.addEventListener('pop', (e) => onPop(JSON.parse(e.data)));
  es.onerror = () => { $('live').classList.add('off'); $('online').textContent = T().reconnecting; };
  es.onopen = () => { $('live').classList.remove('off'); };

  function maxSize() { return Math.max(90, Math.min(innerWidth * 0.7, innerHeight * 0.34)); }
  function sizeFor(pumps) { return Math.min(maxSize(), 64 + 12 * Math.sqrt(pumps)); }
  function layoutBox() { $('box').style.height = maxSize() * 1.5 + 'px'; }
  addEventListener('resize', () => { layoutBox(); if (snap?.balloon) $('balloon').style.width = sizeFor(snap.balloon.pumps) + 'px'; });
  layoutBox();

  function applyState(s) {
    snap = s;
    $('online').textContent = T().online(s.online);
    renderNews(s.news[0]);
    renderRecords();
    renderRecordLine();
    const b = s.balloon;
    if (!b) return; // popped view stays until the next balloon arrives
    const el = $('balloon');
    if (b.id !== shownId) {
      shownId = b.id; shownPumps = 0; poppedView = null; myPending = 0;
      document.documentElement.style.setProperty('--balloon', COLORS[b.id % COLORS.length]);
      el.style.visibility = 'visible';
      $('report').hidden = true;
      $('count').style.visibility = 'visible';
      clearInterval(nextTimer);
      $('count').classList.remove('popped');
      $('hint').textContent = T().hint;
    }
    if (b.pumps > shownPumps) {
      const mine = myPending > 0;
      if (mine) myPending--;
      el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
      const d = b.pumps - shownPumps;
      plus(`+${N(d)} ` + (mine ? T().you : b.last || ''), mine);
      if (!mine) sfx.puff(b.pumps, Math.min(1, .4 + d / 20));
    }
    shownPumps = b.pumps;
    el.style.width = sizeFor(b.pumps + breath()) + 'px';
    const stretch = curDanger = b.danger;
    el.style.setProperty('--stretch', stretch.toFixed(3));
    el.classList.toggle('tense', stretch > .5);
    document.body.classList.toggle('tremble', stretch > .8);
    $('hint').textContent = stretch >= .15 ? T().danger(Math.round(stretch * 100)) : T().hint;
    $('count').textContent = N(b.pumps);
    $('status').innerHTML = b.last ? T().lastPump(b.last) : T().untouched(b.id);
  }

  function renderRecordLine() {
    const big = snap?.records.biggest;
    $('record').textContent = T().recordLine(myStreak, myScore, big ? big.pumps : 0);
    const btn = $('bankBtn');
    btn.hidden = myStreak === 0 || !!poppedView;
    btn.textContent = T().bankBtn(myStreak);
  }

  function bank() {
    if (!me || myStreak === 0) return;
    fetch('/bank', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: me.id }) })
      .then((r) => r.json().then((b) => ({ ok: r.ok, b })))
      .then(({ ok, b }) => {
        if (!ok) return;
        myScore = b.score; myStreak = 0;
        plus(T().banked(b.points), true);
        sfx.bank();
        renderRecordLine();
      })
      .catch(() => {});
  }
  $('bankBtn').addEventListener('click', (e) => { e.stopPropagation(); audio.unlock(); bank(); });
  document.addEventListener('keydown', (e) => { if (e.code === 'KeyB' && !e.repeat) bank(); });

  function plus(text, mine) {
    const now = performance.now();
    if (!mine && now - lastPlusAt < 220) return;
    lastPlusAt = now;
    const p = document.createElement('span');
    p.className = 'plus' + (mine ? ' me' : '');
    p.textContent = text;
    p.style.left = `calc(50% + ${(Math.random() * 2 - 1) * 120}px)`;
    $('box').appendChild(p);
    setTimeout(() => p.remove(), 1150);
  }

  // ---------- pumping: a click is one puff, holding blows a bigger breath ----------
  const MAX_BREATH = 20, BREATH_MS = 110;
  let holdStart = 0, holdTimer = null;
  function breath() { return holdStart ? Math.min(MAX_BREATH, 1 + Math.floor((performance.now() - holdStart) / BREATH_MS)) : 0; }
  function startHold() {
    if (holdStart || !me || !snap?.balloon || poppedView) return;
    if (performance.now() - lastPumpAt < COOLDOWN) return;
    holdStart = performance.now();
    sfx.hiss(true);
    holdTimer = setInterval(() => {
      if (!snap?.balloon) return endHold(true);
      const n = breath();
      $('breath').textContent = n > 1 ? '+' + N(n) : '';
      $('balloon').style.width = sizeFor(snap.balloon.pumps + n) + 'px';
    }, 40);
  }
  function endHold(cancel) {
    if (!holdStart) return;
    const n = breath();
    holdStart = 0; clearInterval(holdTimer); sfx.hiss(false);
    $('breath').textContent = '';
    if (!cancel) pump(n);
  }

  function pump(amount) {
    if (!me || !snap?.balloon) return;
    lastPumpAt = performance.now();
    myPending++;
    sfx.puff(snap.balloon.pumps, 1);
    fetch('/pump', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: me.id, amount }) })
      .then((r) => r.json().then((b) => ({ ok: r.ok, b })))
      .then(({ ok, b }) => {
        if (!ok) { myPending = Math.max(0, myPending - 1); return; }
        myStreak = b.streak;
        renderRecordLine();
      })
      .catch(() => { myPending = Math.max(0, myPending - 1); });
  }
  $('stage').addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, .report') || e.button > 0) return;
    audio.unlock(); startHold();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => $('stage').addEventListener(t, () => endHold()));
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || e.repeat || !$('popOverlay').hidden || !$('recordsOverlay').hidden) return;
    e.preventDefault(); audio.unlock(); startHold();
  });
  document.addEventListener('keyup', (e) => { if (e.code === 'Space') endHold(); });

  // ---------- pop ----------
  function onPop(p) {
    lastPopEvent = p; poppedView = p; myPending = 0;
    sfx.pop();
    const el = $('balloon'), r = el.getBoundingClientRect();
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.className = 'shard';
      s.style.left = r.left + r.width / 2 + 'px';
      s.style.top = r.top + r.height * .4 + 'px';
      const a = Math.random() * Math.PI * 2, d = 100 + Math.random() * 260;
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      s.style.setProperty('--rot', Math.random() * 540 + 'deg');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 850);
    }
    el.style.visibility = 'hidden';
    $('count').textContent = N(p.pumps);
    $('count').classList.add('popped');
    $('status').innerHTML = p.you ? T().youPopped : T().poppedBy(p.city);
    $('hint').innerHTML = '&nbsp;';
    if (p.you) myStreak = 0;
    curDanger = 0;
    document.body.classList.remove('tremble');
    renderRecordLine();
    setTimeout(() => showReport(p), 450);
    if (p.you) {
      try { navigator.vibrate && navigator.vibrate([100, 50, 180]); } catch (e) {}
      document.body.classList.add('flash');
      setTimeout(() => document.body.classList.remove('flash'), 120);
    }
  }

  // ---------- pop report: everyone gets one, with their own part in it ----------
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const secs = (ms) => T().secs(ms);
  let nextTimer = null;

  // The pop report is shown in either language, so random choices are made once (as indexes) and reused.
  function verdict(p) {
    const v = T().verdicts;
    const list = p.you ? v.you : !p.yourPumps ? v.none
      : (p.yourLastBefore <= 2 || p.yourLastAgoMs < 1500) ? v.close : p.yourLastBefore <= 12 ? v.mid : v.far;
    return list[p.vIdx % list.length];
  }
  const clock = (d) => d.toLocaleTimeString(lang === 'fa' ? 'fa-IR' : 'en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  function showReport(p, rerender) {
    if (!rerender) {
      p.died = new Date(); p.born = new Date(p.died - p.ageMs);
      p.lwIdx = Math.floor(Math.random() * 10); p.vIdx = Math.floor(Math.random() * 12); p.shareIdx = Math.floor(Math.random() * 3);
      p.role = p.you ? 'GUILTY' : p.youLastSafe ? 'ACCOMPLICE' : 'DECEASED';
    }
    const t = T(), lw = t.lastWords[p.lwIdx];
    const yours = p.you
      ? `<div>${t.cause(p.pumps)}</div>` + (p.lostStreak > 0 ? `<div>${t.buried(p.lostStreak)}</div>` : '')
      : p.yourPumps
        ? `<div>${t.yourPart(t.pumps(p.yourPumps), p.yourRank, p.people)}</div><div>${t.yourLast(t.pumps(p.yourLastBefore), secs(p.yourLastAgoMs))}</div>`
        : `<div>${t.noPart}</div>`;
    $('report').innerHTML = `
      <div class="obit">
        <div class="o-kicker">${t.kicker}</div>
        <h2 class="o-name">${t.oName(p.id)}</h2>
        <div class="o-dates">${t.dates(clock(p.born), clock(p.died))}</div>
        <div class="o-cross"></div>
        <p class="o-body">${t.lived(secs(p.ageMs), t.pumps(p.pumps))}</p>
        <p class="o-body">${t.survived(p.people, p.cities)}${p.bigBreath ? t.bigBreath(p.bigBreath.city.split(',')[0], p.bigBreath.amount) : ''}</p>
        <p class="o-body">${p.you ? t.killerYou : t.killer(p.city)}</p>
        <p class="o-last">${t.lastWordsLine(lw)}</p>
        <div class="o-you">${yours}<div class="o-verdict">${verdict(p)}</div></div>
        <div class="stamp"${rerender ? ' style="animation-delay:0s"' : ''}>${t.roles[p.role]}</div>
      </div>
      <div class="r-actions">
        <button type="button" class="primary" id="rShare">${t.shareBtn}</button>
        <button type="button" id="rCert">${t.certBtn(p.you)}</button>
        <span class="r-next" id="rNext"></span>
      </div>`;
    $('report').hidden = false;
    $('status').innerHTML = '&nbsp;';
    $('count').style.visibility = 'hidden';
    $('rShare').addEventListener('click', (e) => copyShare(p, e.currentTarget));
    $('rCert').addEventListener('click', () => showCertificate(p));
    if (rerender) { if (p.left != null) $('rNext').textContent = T().next(p.left + 1); return; }
    setTimeout(() => sfx.stamp(), 560);
    p.left = 7;
    const tick = () => { const n = $('rNext'); if (n) n.textContent = T().next(p.left); p.left--; };
    tick(); clearInterval(nextTimer); nextTimer = setInterval(tick, 1000);
  }

  function shareText(p) {
    const t = T(), u = location.origin, q = { ...p, lw: t.lastWords[p.lwIdx] };
    if (p.you) return t.share.you(q, u)[p.shareIdx];
    if (p.youLastSafe) return t.share.accomplice(q, u);
    if (p.yourPumps) return t.share.pumped(q, u);
    return t.share.watched(q, u);
  }
  async function copyShare(p, btn) {
    const old = btn.textContent;
    try { await navigator.clipboard.writeText(shareText(p)); btn.textContent = T().copied; } catch (err) { btn.textContent = T().copyBlocked; }
    setTimeout(() => { btn.textContent = old; }, 1500);
  }

  async function showCertificate(p) {
    const fa = lang === 'fa', t = T();
    const serif = fa ? '"Noto Naskh Arabic", "Vazirmatn", serif' : '"EB Garamond", Georgia, serif';
    const label = fa ? '"Vazirmatn", Tahoma, sans-serif' : '"JetBrains Mono", monospace';
    try { await document.fonts.load(`600 60px ${serif}`); await document.fonts.load(`40px ${serif}`); await document.fonts.load(`28px ${label}`); if (!fa) await document.fonts.load(`italic 40px ${serif}`); } catch (e) {}
    const W = 1080, H = 1350, ink = '#1b1a18', muted = '#7d7a73', red = '#c8331d';
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.direction = fa ? 'rtl' : 'ltr';
    const start = fa ? W - 140 : 140, alignStart = fa ? 'right' : 'left';
    x.fillStyle = '#f1ede3'; x.fillRect(0, 0, W, H);
    x.strokeStyle = ink; x.lineWidth = 3; x.strokeRect(60, 60, W - 120, H - 120);
    x.lineWidth = 1; x.strokeRect(76, 76, W - 152, H - 152);
    x.textAlign = 'center'; x.fillStyle = muted; x.font = `24px ${label}`;
    x.fillText(t.certNo(p.id), W / 2, 150);
    x.fillStyle = ink; x.font = `600 ${fa ? 70 : 78}px ${serif}`;
    x.fillText(t.certTitle(p.you), W / 2, 250);
    x.fillRect(W / 2 - 60, 295, 120, 2);

    const q = { ...p, lw: t.lastWords[p.lwIdx], bornS: clock(p.born), diedS: clock(p.died) };
    const rows = p.you ? t.certRowsYou(q) : t.certRows(q);
    let y = 400;
    rows.forEach(([k, v], idx) => {
      x.textAlign = alignStart; x.fillStyle = muted; x.font = `22px ${label}`;
      x.fillText(k, start, y);
      const last = idx === rows.length - 1;
      x.fillStyle = ink; x.font = (last && !fa ? 'italic ' : '') + `${fa ? 36 : 40}px ${serif}`;
      const words = v.split(' '), lines = []; let line = '';
      for (const w of words) { const tt = line ? line + ' ' + w : w; if (x.measureText(tt).width > W - 280 && line) { lines.push(line); line = w; } else line = tt; }
      lines.push(line);
      lines.slice(0, 2).forEach((l, i) => x.fillText(l, start, y + 50 + i * 48));
      y += 50 + lines.slice(0, 2).length * 48 + 34;
    });

    // stamp
    x.save(); x.translate(fa ? 290 : W - 290, H - 250); x.rotate(fa ? 0.22 : -0.24);
    x.strokeStyle = red; x.fillStyle = red; x.globalAlpha = .88;
    x.lineWidth = 7; x.strokeRect(-190, -62, 380, 124);
    x.lineWidth = 2; x.strokeRect(-176, -48, 352, 96);
    x.textAlign = 'center'; x.font = `${fa ? '700 54px ' + label : '500 52px ' + label}`; x.fillText(t.roles[p.role], 0, 18);
    x.restore();

    x.textAlign = alignStart; x.fillStyle = muted; x.font = (fa ? '' : 'italic ') + `30px ${serif}`;
    x.fillText(verdict(p), start, H - 150);

    const url = c.toDataURL('image/png');
    $('certImg').src = url;
    $('downloadBtn').href = url;
    $('popTitle').textContent = t.certTitle(p.you);
    $('popOverlay').hidden = false;
  }

  $('copyBtn').addEventListener('click', (e) => { if (lastPopEvent) copyShare(lastPopEvent, e.currentTarget); });

  // ---------- news + records ----------
  function renderNews(item) {
    if (!item) return;
    const f = T().news[item.k];
    const text = f ? f(item) : '';
    if (!text || text === lastNews) return;
    lastNews = text;
    const el = $('news');
    el.classList.add('fade');
    setTimeout(() => { el.textContent = text; el.classList.remove('fade'); }, 300);
  }
  function renderRecords() {
    const s = snap, r = s.records, t = T().rec;
    const row = (k, v, sub) => `<li><span class="k">${k}${sub ? `<small>${sub}</small>` : ''}</span><span class="v">${v}</span></li>`;
    const pumps = (n) => T().pumps(n);
    $('records').innerHTML =
      row(t.biggest, r.biggest ? pumps(r.biggest.pumps) : '—', r.biggest && t.poppedBy(r.biggest.city)) +
      row(t.smallest, r.smallest ? pumps(r.smallest.pumps) : '—', r.smallest && t.poppedBy(r.smallest.city)) +
      row(t.streak, r.longestStreak ? pumps(r.longestStreak.n) : '—', r.longestStreak && t.someone(r.longestStreak.city)) +
      row(t.bank, r.biggestBank ? t.pts(r.biggestBank.points) : '—', r.biggestBank && t.bankSub(r.biggestBank.streak, r.biggestBank.city)) +
      row(t.pumpsToday, N(s.totals.pumps)) +
      row(t.popsToday, N(s.totals.pops));
    $('wall').innerHTML = s.wall.length
      ? s.wall.map((w) => row(B(w.city), t.wallN(w.n))).join('')
      : `<li><span class="k">${t.wallEmpty}</span></li>`;
  }
  $('recordsBtn').addEventListener('click', () => { $('recordsOverlay').hidden = false; });
  document.querySelectorAll('.overlay').forEach((o) => o.addEventListener('click', (e) => {
    if (e.target === o || e.target.closest('[data-close]')) o.hidden = true;
  }));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.overlay').forEach((o) => { o.hidden = true; }); });

  // ---------- sound (synthesized, no files) ----------
  const audio = (() => {
    let ctx = null, on = true;
    function unlock() {
      if (ctx) { ctx.resume(); return; }
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    function noise(sec) {
      const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return b;
    }
    return { unlock, noise, get ctx() { return ctx; }, get on() { return on; }, set on(v) { on = v; } };
  })();
  const sfx = {
    // Continuous rush of air while a breath is held; rises in pitch the longer you blow.
    hiss(on) {
      const c = audio.ctx; if (!c) return;
      if (on && audio.on) {
        const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
        n.buffer = audio.noise(3); n.loop = true; f.type = 'bandpass'; f.Q.value = 1.1;
        f.frequency.setValueAtTime(700, c.currentTime); f.frequency.linearRampToValueAtTime(2600, c.currentTime + MAX_BREATH * BREATH_MS / 1000);
        g.gain.setValueAtTime(.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(.16, c.currentTime + .08);
        n.connect(f).connect(g).connect(c.destination); n.start();
        this._hiss = { n, g };
      } else if (this._hiss) {
        const { n, g } = this._hiss; this._hiss = null;
        g.gain.setTargetAtTime(.0001, c.currentTime, .03); n.stop(c.currentTime + .15);
      }
    },
    // A puff of air plus a rubbery squeak that rises as the balloon tightens.
    puff(pumps, vol) {
      const c = audio.ctx; if (!c || !audio.on) return;
      const t = c.currentTime;
      const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      n.buffer = audio.noise(.14); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = .8;
      g.gain.setValueAtTime(.12 * vol, t); g.gain.exponentialRampToValueAtTime(.001, t + .13);
      n.connect(f).connect(g).connect(c.destination); n.start(t); n.stop(t + .14);
      const o = c.createOscillator(), og = c.createGain(), base = Math.min(1500, 320 + pumps * 3);
      o.type = 'sine'; o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * 1.25, t + .09);
      og.gain.setValueAtTime(.05 * vol, t); og.gain.exponentialRampToValueAtTime(.001, t + .1);
      o.connect(og).connect(c.destination); o.start(t); o.stop(t + .12);
    },
    // Heartbeat: louder and (via the caller's timing) faster as the balloon nears its limit.
    heart(d) {
      const c = audio.ctx; if (!c || !audio.on) return;
      [0, .16].forEach((off, i) => {
        const t = c.currentTime + off, o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(i ? 52 : 62, t); o.frequency.exponentialRampToValueAtTime(38, t + .12);
        g.gain.setValueAtTime(.35 * d, t); g.gain.exponentialRampToValueAtTime(.001, t + .14);
        o.connect(g).connect(c.destination); o.start(t); o.stop(t + .16);
      });
    },
    bank() {
      const c = audio.ctx; if (!c || !audio.on) return;
      [660, 880, 1320].forEach((f, i) => {
        const t = c.currentTime + i * .07, o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
        o.connect(g).connect(c.destination); o.start(t); o.stop(t + .2);
      });
    },
    stamp() {
      const c = audio.ctx; if (!c || !audio.on) return;
      const t = c.currentTime, n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      n.buffer = audio.noise(.12); f.type = 'lowpass'; f.frequency.value = 700;
      g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t + .1);
      n.connect(f).connect(g).connect(c.destination); n.start(t); n.stop(t + .12);
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(50, t + .08);
      og.gain.setValueAtTime(.5, t); og.gain.exponentialRampToValueAtTime(.001, t + .1);
      o.connect(og).connect(c.destination); o.start(t); o.stop(t + .12);
    },
    pop() {
      const c = audio.ctx; if (!c || !audio.on) return;
      const t = c.currentTime;
      const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      n.buffer = audio.noise(.25); f.type = 'highpass'; f.frequency.value = 500;
      g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .22);
      n.connect(f).connect(g).connect(c.destination); n.start(t); n.stop(t + .25);
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + .2);
      og.gain.setValueAtTime(.5, t); og.gain.exponentialRampToValueAtTime(.001, t + .25);
      o.connect(og).connect(c.destination); o.start(t); o.stop(t + .3);
    },
  };
  (function beat() {
    const d = curDanger, active = d > .3 && !poppedView;
    if (active) sfx.heart(d);
    setTimeout(beat, active ? 1000 - 650 * d : 400);
  })();
  document.addEventListener('pointerdown', () => audio.unlock(), { once: true });
  $('soundBtn').addEventListener('click', (e) => {
    e.stopPropagation(); audio.unlock(); audio.on = !audio.on;
    $('soundBtn').setAttribute('aria-pressed', String(audio.on));
    $('soundBtn').textContent = T().sound(audio.on);
  });
  applyLang();
})();
</script>
</body>
</html>
